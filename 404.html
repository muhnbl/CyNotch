<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — CyNotch</title>
<meta name="theme-color" content="#0A0712">
<link rel="icon" href="./assets/cynotch-icon-64.png" sizes="64x64" type="image/png">
<style>
:root{--ink:#0A0712;--surface:#130D22;--line:rgba(216,180,254,.18);--accent:#C77DFF;--accent-hi:#E2B6FF;--text:#F4EFFC;--muted:#ADA2C4;--mono:ui-monospace,"Cascadia Code",Consolas,monospace;--sans:"Instrument Sans","Segoe UI Variable Text",system-ui,sans-serif;--display:"Chakra Petch","Bahnschrift SemiCondensed",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,rgba(147,51,234,.2),transparent 62%),var(--ink);color:var(--text);font-family:var(--sans);text-align:center}
.skip-link{position:fixed;top:-60px;left:16px;background:var(--accent);color:#16071F;padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip-link:focus{top:12px}
main{max-width:460px;padding:36px 28px;border-radius:22px;border:1px solid var(--line);background:rgba(19,13,34,.82);box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.code{font-family:var(--mono);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:12px 0 14px}
p{margin:0 0 26px;color:var(--muted);line-height:1.6}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;background:var(--accent);color:#170722;font-weight:600;text-decoration:none}
a.btn:hover{background:var(--accent-hi)}
a.btn:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main">
  <div class="code">Error 404 · Jurisdiction missing</div>
  <h1>Nothing at this coordinate.</h1>
  <p>General Cyno searched the top of the screen and found no route here. Return to the Command Hub.</p>
  <a class="btn" href="./">Back to CyNotch</a>
</main>
</body>
</html>
